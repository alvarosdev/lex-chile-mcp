services:
  lex-chile-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lex-chile-mcp-server
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_PATH=${MCP_PATH:-/mcp}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    # Hardening: the server never writes to disk (config is baked in, the
    # ETag cache lives in memory), so the rootfs is read-only with a tmpfs
    # only for /tmp, all capabilities dropped, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
