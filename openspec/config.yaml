schema: spec-driven

# Project context — shown to the AI when creating artifacts.
# These conventions are inherited by every future change.
context: |
  LANGUAGE POLICY (governs reasoning, artifacts, code and execution):
  - Work in English. All reasoning, planning and every OpenSpec artifact
    (proposal, specs, design, tasks) are written in English. Specs created
    before this policy may still be in Spanish — do not copy that style; new
    artifacts are English-only.
  - Code, identifiers, filenames and code comments are in English.
  - Spanglish is allowed where the domain demands it: Chilean legal nouns with
    no clean English equivalent stay in Spanish inside otherwise-English names
    (e.g. search_cgr_dictamenes, get_cgr_instructivo,
    count_cgr_jurisprudencia). Verbs and structure are English; only the
    domain noun stays Spanish.
  - Raw domain data stays untouched: legal text is Spanish, BCN/CGR response
    fields and API parameter names (idNorma, n_dictamen) keep their original
    form. Translation ends at the boundary (norm_id in the tool -> idNorma in
    the query param).

  Tech stack: Go 1.27. MCP server with modelcontextprotocol/go-sdk v1.7.0
  (stdio + streamable HTTP, one instance serving both transports). HTTP client
  resty v3 (resty.dev/v3 v3.0.0-rc.3) with one *resty.Client per resource
  (built-in count-based breaker + per-request retry declared in the YAML).
  golang.org/x/sync singleflight coalesces concurrent requests for the same
  key (retry and breaker run inside the flight). In-memory caching: bcn uses
  an ETag-revalidating LRU (etagCache); cgr uses plain LRU tiers (light=100 /
  heavy=20 — CGR sends no ETag/304). html-to-markdown v2.5.2 (base+commonmark+
  table plugins). yaml.v3 for the endpoint contract. Testify (suite) + mockery
  v3 as a Go tool (testify template; mocks generated next to the source file
  with snake_case names).
  Domain: search and retrieval of Chilean legal norms and administrative
  jurisprudence from two upstream sources — LeyChile / Biblioteca del Congreso
  Nacional (BCN: laws, decrees, resolutions) and Contraloría General de la
  República (CGR: dictámenes, auditorías, instructivos, jurisprudencia).

  Act as a senior Go developer with MCP experience. Before defining any
  artifact, make sure the proposal is consistent with the project context and
  development conventions. If it is not, fix the proposal before continuing.

  Project conventions:
  - Config: endpoints declared in internal/config/api.resources.yaml (BCN and
    CGR resources), prompts in internal/prompts/bcn/prompts.yaml and
    internal/prompts/cgr/prompts.yaml (shared renderer in
    internal/prompts/internal). All baked into the binary via go:embed (no env
    override, no hot-reload, no external files — changes ship by rebuilding
    the binary/image, which embeds them). Server settings via MCP_TRANSPORT,
    MCP_HOST, MCP_PORT, MCP_PATH and MCP_AUTH_TOKEN env vars, loaded once at
    startup. Single instance injected via constructor (never global state).
  - LLM-first + structured: every tool returns TextContent formatted for model
    reading AND typed structuredContent as the handler's second value (the
    go-sdk generates the outputSchema automatically). The text is a view of
    the structured data (same data, no drift); never JSON embedded as a string
    inside the text; optional output fields use omitempty.
  - Tests without network: testify suites with generated mocks created in
    SetupTest; the real clients are tested against httptest.Server with real
    fixtures in testdata/. In mock expectations used by MCP handlers, match
    ctx with mock.Anything (the go-sdk passes a derived context; a mismatch
    causes Goexit in the handler goroutine and hangs CallTool). Tool args with
    defaults carry omitempty in the json tag (without omitempty the generated
    schema marks them required).
  - Sanitization: all text reaching the LLM goes through
    internal/bcn/sanitize.go or internal/cgr/sanitize.go (single pass); API
    "garbage" (entities, &nbsp;, embedded XML, control chars) lives as named
    constants in internal/bcn/garbage.go and internal/cgr/garbage.go — never
    magic strings/numbers in logic.
  - Quality: make check (build+vet+test) as full local verification (same as
    CI), make fmt-check, benchmarks with guard rails in tests. modernize
    linter: prefer slices.Contains/ContainsFunc over membership loops.
  - Infrastructure: multi-stage Dockerfile with BUILDPLATFORM (Go
    cross-compiles natively, QEMU only for the arm64 runtime apk add),
    non-root user, /health healthcheck. LOCAL RUNTIME: podman is the primary
    runtime (podman-compose for orchestration; the compose file is
    tool-agnostic), docker is fallback only — Makefile: make
    podman-build/run/stop/logs and make compose-up/down (chain:
    podman-compose -> docker compose). CI separate from publish (docker
    buildx amd64+arm64 on GitHub -> GHCR with v* tags).
