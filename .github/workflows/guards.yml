name: Branch guards

# Gitflow source policy, enforced as a required status check via the
# repository rulesets:
#   main    <- release/* | hotfix/*
#   develop <- feature/* | backport/* | chore/* | release/* | hotfix/*
# Direct pushes to both branches are blocked by the rulesets themselves
# (pull_request rule, no bypass actors). Branch names reach this script
# through the env block — never interpolated into the shell — so a hostile
# branch name cannot inject commands.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  guard-branch-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          deny() {
            echo "✗ PRs into $1 must come from: $2"
            echo "  (got: $HEAD_REF). See the branch protection policy."
            exit 1
          }

          case "$BASE_REF" in
            main)
              case "$HEAD_REF" in
                release/*|hotfix/*)
                  echo "✓ $HEAD_REF is allowed into main"
                  ;;
                *) deny "main" "release/* or hotfix/* (gitflow)" ;;
              esac
              ;;
            develop)
              case "$HEAD_REF" in
                feature/*|backport/*|chore/*|release/*|hotfix/*)
                  echo "✓ $HEAD_REF is allowed into develop"
                  ;;
                *) deny "develop" "feature/*, backport/*, chore/*, release/* or hotfix/* (gitflow)" ;;
              esac
              ;;
            *)
              echo "No source restriction for $BASE_REF — pass."
              ;;
          esac
