name: Release (dist + image)

# The ONLY release path: a PR from release/v* merged into main.
# Closed without merge → nothing is generated. Manual dispatch asks
# for the version (no head_ref on manual runs).
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    # Gate: only merged PRs from release/* (dispatch always runs).
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/'))
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_HEAD_REF#release/}"
          fi
          VERSION="${VERSION#v}"   # normalize release/v1.2.0 and release/1.2.0
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (tag v${VERSION})"

  dist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Build distributions
        run: bash scripts/build-dist.sh "${{ needs.version.outputs.version }}"

      - name: Upload dist.zip
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.zip
          retention-days: 7

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Needed to run the arm64 runtime stage (apk add) on the amd64
      # runner. The Go compilation itself is not emulated: the builder
      # stage pins --platform=$BUILDPLATFORM and cross-compiles.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # The ref is main (merge trigger), so the version tag is computed
          # explicitly — metadata-action type=version only works on tag refs.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          # cache-from only: reads never fail the build, but cache-to writes
          # can (known "failed to reserve cache" on the GHA cache backend
          # with multi-platform builds — it failed AFTER the image push).
          cache-from: type=gha
  release:
    # Only with a fully green pipeline: any failure in dist or docker
    # blocks the draft release (no release on broken builds).
    needs: [version, dist, docker]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download dist.zip
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Create draft release (idempotent)
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          # Idempotency: replace an existing DRAFT; never touch a published release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -q true; then
              echo "Draft $TAG exists — deleting and recreating"
              gh release delete "$TAG" --yes
            else
              echo "✗ Release $TAG is already published — aborting" >&2
              exit 1
            fi
          fi
          gh release create "$TAG" dist.zip \
            --draft \
            --generate-notes \
            --title "chile-bcn-mcp ${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}"
          echo "✓ Draft release $TAG created — publish it manually"
