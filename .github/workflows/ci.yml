name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Test
        # -race: the client has concurrent code (singleflight, converter
        # pool, LRU cache) — race detection is part of the test suite.
        run: go test ./... -count=1 -race

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        # Pinned version for reproducible builds; fails the job on known
        # vulnerabilities in dependencies.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
