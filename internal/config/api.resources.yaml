# LeyChile API resources contract.
# Each resource declares where and how to call one BCN endpoint.
# Loaded once at startup and validated fail-fast (see internal/config).
version: 1

resources:
  search_laws:
    url: https://nuevo.leychile.cl
    path: /servicios/buscarjson
    method: GET
    timeout: 10s
    retry:
      attempts: 3
      backoff: 500ms
      max_backoff: 5s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s

  get_law:
    url: https://nuevo.leychile.cl
    path: /servicios/Navegar/get_norma_json
    method: GET
    timeout: 15s
    retry:
      attempts: 2
      backoff: 1s
      max_backoff: 4s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s
  get_law_history:
    url: https://nuevo.leychile.cl
    path: /servicios/Navegar/get_historias_de_ley
    method: GET
    timeout: 10s
    retry:
      attempts: 2
      backoff: 500ms
      max_backoff: 4s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s

  cgr_search:
    url: https://www.contraloria.cl
    path: /apibusca/search
    method: POST
    timeout: 12s
    retry:
      attempts: 3
      backoff: 500ms
      max_backoff: 5s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s
  cgr_count:
    url: https://www.contraloria.cl
    path: /apibusca/count/todos
    method: POST
    timeout: 10s
    retry:
      attempts: 2
      backoff: 500ms
      max_backoff: 4s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s
